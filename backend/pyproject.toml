[project]
name = "hindsight"
version = "0.1.0"
description = "See what your past stock sales really cost you"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.120",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.11",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
]

[tool.alembic]
# Migrations live in backend/migrations; versions/ holds one file per schema change.
script_location = "%(here)s/migrations"
file_template = "%%(rev)s_%%(slug)s"

[project]
name = "hindsight"
version = "0.1.0"
description = "See what your past stock sales really cost you"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "fastapi>=0.120",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.11",
    "pyjwt>=2.10",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs, SIM: simpler code, S: security
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert and fake passwords on purpose.
"tests/**" = ["S101", "S105", "S106"]
# Generated by Alembic, reviewed but not reflowed by hand.
"migrations/versions/**" = ["E501"]

[tool.alembic]
# Migrations live in backend/migrations; versions/ holds one file per schema change.
script_location = "%(here)s/migrations"
file_template = "%%(rev)s_%%(slug)s"

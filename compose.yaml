# One command runs everything:  docker compose up --build
name: hindsight

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hindsight}
      POSTGRES_USER: ${POSTGRES_USER:-hindsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql   # data survives "docker compose down" and restarts
    ports:
      - "127.0.0.1:5432:5432"        # only reachable from this computer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HINDSIGHT_ENV: docker
      HINDSIGHT_LOG_LEVEL: ${HINDSIGHT_LOG_LEVEL:-INFO}
      HINDSIGHT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hindsight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hindsight}
    depends_on:
      db:
        condition: service_healthy   # start the API only once Postgres accepts connections
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:

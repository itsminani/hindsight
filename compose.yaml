# One command runs everything:  docker compose up --build
name: hindsight

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hindsight}
      POSTGRES_USER: ${POSTGRES_USER:-hindsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql   # data survives "docker compose down" and restarts
    ports:
      - "127.0.0.1:5432:5432"        # only reachable from this computer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once, applies pending migrations, then exits.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      HINDSIGHT_ENV: docker
      HINDSIGHT_LOG_LEVEL: ${HINDSIGHT_LOG_LEVEL:-INFO}
      HINDSIGHT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hindsight}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hindsight}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully   # start the API only on an up-to-date schema
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:

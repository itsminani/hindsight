[project]
name = "hindsight-conformance"
version = "0.1.0"
description = "Black-box conformance tests: a running Hindsight server against contract/openapi.yaml"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "jsonschema>=4.25",
    "pytest>=8.4",
    "pyyaml>=6.0",
    "referencing>=0.36",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
